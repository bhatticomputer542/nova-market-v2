<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Market Admin</title><link rel="stylesheet" href="/styles.css"><style>.admin-wrap{max-width:1100px;margin:35px auto;padding:0 20px}.admin-box{border:1px solid #e8eaf0;padding:22px;border-radius:8px;margin:20px 0}.admin-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.admin-form label{font-size:12px;font-weight:700}.admin-form input,.admin-form textarea{display:block;width:100%;padding:11px;border:1px solid #d8dbe2;border-radius:4px;margin-top:5px;font:inherit}.admin-form textarea{min-height:70px}.wide{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table th,.admin-table td{text-align:left;padding:12px;border-bottom:1px solid #e8eaf0;vertical-align:top}.admin-table button{padding:7px;margin:2px;cursor:pointer}.muted{color:#667085;font-size:13px}.table-scroll{overflow:auto}@media(max-width:700px){.admin-form{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="topbar"><a class="brand" href="/">NOVA<span>MARKET</span></a><nav><a href="/">View store</a></nav></header><main class="admin-wrap"><p class="eyebrow">STORE MANAGEMENT</p><h1>Admin dashboard</h1><p class="muted">Enter the private ADMIN_KEY configured in Railway. Never share it.</p><section class="admin-box"><label>Admin key<input id="admin-key" type="password" autocomplete="current-password" style="padding:12px;width:min(500px,100%);display:block;margin-top:8px;border:1px solid #d8dbe2;border-radius:4px"></label><div class="actions"><button id="connect" class="primary-btn">Connect</button><button id="load-orders" class="primary-btn">Load orders</button></div><p id="message" role="status"></p></section><section class="admin-box"><h2 id="form-title">Add product</h2><form id="product-form" class="admin-form"><input type="hidden" name="id"><label>Name<input name="name" required></label><label>Category<input name="category" required value="Clothing"></label><label>Price (PKR)<input name="price" type="number" min="0" step="1" required></label><label>Tag<input name="tag" placeholder="New / Popular"></label><label class="wide">Image URL<input name="image" type="url"></label><label class="wide">Description<textarea name="description"></textarea></label><div class="actions wide"><button class="primary-btn" type="submit">Save product</button><button id="clear-form" type="button">Clear</button></div></form></section><section class="admin-box"><h2>Products</h2><div class="table-scroll"><table class="admin-table"><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Actions</th></tr></thead><tbody id="products-body"><tr><td colspan="4">Connect to load products.</td></tr></tbody></table></div></section><section class="admin-box"><h2>Orders</h2><div class="table-scroll"><table class="admin-table"><thead><tr><th>Order</th><th>Customer</th><th>Items / total</th><th>Status</th><th>Update</th></tr></thead><tbody id="orders-body"><tr><td colspan="5">Click Load orders.</td></tr></tbody></table></div></section></main><script src="/admin.js" defer></script></body></html>
